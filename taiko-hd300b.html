[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}body{margin:0}
.back{margin:0 0 10px;font-size:13px}.back a{color:var(--muted);text-decoration:none}.back a:hover{color:var(--accent)}
/* Layout: viewport 3D besar di kiri, panel data bagian (nomor katalog + material) di kanan; di HP panel turun. */
:root{
  --bg:#edf1f4; --surface:#ffffff; --ink:#10212e; --muted:#566874; --line:#cbd5dc;
  --accent:#d4501a; --accent-ink:#ffffff; --stage:#e3e9ee; --grid:rgba(16,33,46,.07);
  --chip:#f3f6f8; --ok:#1c7c4a; --bad:#b3342b;
  --f-head:"Space Grotesk",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b141b; --surface:#111e28; --ink:#e5ecf1; --muted:#90a3b0; --line:#243643;
  --accent:#ff7d42; --accent-ink:#1a0c04; --stage:#0e1a23; --grid:rgba(229,236,241,.06);
  --chip:#0e1a23; --ok:#4cc98a; --bad:#ff7a70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b141b; --surface:#111e28; --ink:#e5ecf1; --muted:#90a3b0; --line:#243643;
  --accent:#ff7d42; --accent-ink:#1a0c04; --stage:#0e1a23; --grid:rgba(229,236,241,.06);
  --chip:#0e1a23; --ok:#4cc98a; --bad:#ff7a70; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
h1{font-family:var(--f-head);font-weight:700;font-size:clamp(28px,4.4vw,44px);line-height:1.05;margin:0;text-wrap:balance}
.sub{margin:8px 0 0;color:var(--muted);max-width:72ch}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;height:clamp(420px,70vh,700px);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  background-color:var(--stage);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;touch-action:none}
@media (max-width:600px){.stage{height:min(56vh,460px);min-height:340px}}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#gl:active{cursor:grabbing}
.pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pin{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);
  font:500 11px/1 var(--f-mono);display:grid;place-items:center;padding:0;pointer-events:auto;cursor:pointer;will-change:transform}
.pin.hid{border-style:dashed;background:var(--stage)}
.pin.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pin:focus-visible,.btn:focus-visible,.pl button:focus-visible,.seg button:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:5px;white-space:nowrap;z-index:3}
.hint{position:absolute;left:12px;bottom:10px;margin:0;font-size:12px;color:var(--muted);pointer-events:none;max-width:calc(100% - 24px)}
.legend{position:absolute;right:10px;top:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;display:grid;gap:3px;max-width:calc(100% - 20px)}
.legend[hidden]{display:none}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.25);flex:none}
.nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.exwrap{display:flex;align-items:center;gap:10px;flex:1 1 220px;min-width:200px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.exwrap label{font-size:13px;font-weight:600;white-space:nowrap}
.exwrap input{flex:1;min-width:0;accent-color:var(--accent)}
.btn{font:500 13px/1 var(--f-body);padding:10px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:500 13px/1 var(--f-body);padding:10px 12px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font-family:var(--f-head);font-size:22px;line-height:1.15;margin:0 0 2px;text-wrap:balance}
.card .id{color:var(--muted);margin:0 0 12px;font-size:14px}
.card dl{margin:0;display:grid;gap:10px}
.card dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin:0}
.card dd{margin:2px 0 0}
.num{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.empty{color:var(--muted);margin:0}
.tw{overflow-x:auto;margin-top:2px}
table.mt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.mt th{font-weight:600;text-align:left;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:4px 6px 4px 0;border-bottom:1px solid var(--line)}
table.mt td{padding:5px 6px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.mt td:first-child{font-family:var(--f-mono);font-size:12px}
table.mt .on{color:var(--ink);font-weight:600}
table.mt .off{color:var(--muted)}
.pl{list-style:none;margin:0;padding:6px;display:grid;gap:3px;max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.pl button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:7px 8px;border-radius:6px;cursor:pointer;font:inherit;font-size:14px}
.pl button:hover{background:var(--chip)}
.pl button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.pl .n{font-family:var(--f-mono);font-size:12px;min-width:20px;opacity:.8}
.pl .t{display:flex;flex-direction:column;min-width:0}
.pl .s{font-size:12px;opacity:.75;font-family:var(--f-mono)}
.quiz .q{font-size:17px;margin:8px 0 12px;font-weight:500}
.quiz .fb{margin:10px 0;padding:10px 12px;border-radius:8px;background:var(--chip);border:1px solid var(--line)}
.quiz .fb.ok{border-color:var(--ok)} .quiz .fb.bad{border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.below{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.below h3{font-family:var(--f-head);font-size:17px;margin:0 0 8px}
table.spec{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.spec td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.spec td:first-child{color:var(--muted);width:46%;padding-right:10px}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.note a{color:var(--accent)}
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.selchip{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;display:none;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.selchip span{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.3}
.selchip small{display:block;font:500 11px var(--f-mono);color:var(--muted);font-weight:500}
@media (max-width:960px){
  .selchip.on{display:flex}
  .stage.hassel .hint{display:none}
  .stage #quizbox{position:absolute;left:10px;right:10px;top:10px;z-index:4;max-height:48%;overflow:auto;padding:12px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
  .stage #quizbox h2{font-size:18px}
  .stage #quizbox .q{font-size:15px;margin:6px 0 8px}
  .stage #quizbox .fb{margin:8px 0;font-size:13px;padding:8px 10px}
}
table.mt tr.rw{cursor:pointer}
table.mt tr.rw:hover td{background:var(--chip)}
table.mt tr.rw:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
table.mt tr.rsel td,table.mt tr.rsel td.on,table.mt tr.rsel td.off{background:var(--accent);color:var(--accent-ink)}
.subbox{border:1px solid var(--accent);border-radius:8px;padding:10px 12px;margin:0 0 12px;background:var(--chip)}
.subbox h3{margin:2px 0 4px;font-size:17px}
.subbox p{margin:4px 0}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.qopt{font-size:13px;text-align:left}
@media (pointer:coarse){
  table.mt td{padding-block:11px}
  .btn,.seg button{min-height:44px;padding:12px 14px}
  .exwrap{min-height:48px}
  .exwrap input{height:32px}
  .pin::after{content:"";position:absolute;inset:-5px}
  .pl button{min-height:52px}
}

.leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.leaders line{stroke:var(--muted);stroke-width:1;opacity:.75}
.leaders circle{fill:var(--muted);opacity:.75}

.st{display:inline-block;font:500 11px/1.4 var(--f-mono);padding:1px 7px;border-radius:999px;border:1px solid var(--line);background:var(--chip);white-space:nowrap}
.st::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:currentColor;vertical-align:baseline}
.st-resmi{color:var(--ok);border-color:var(--ok)}
.st-int{color:var(--accent);border-color:var(--accent)}
.st-est{color:var(--muted);border-color:var(--muted)}
.st-belum{color:var(--bad);border-color:var(--bad)}
.stline{font-size:12px;line-height:2;margin:6px 0 0;color:var(--ink)}
.stline b{font-weight:600;margin-right:3px}
.srcline{font-size:13px;margin:0 0 4px}
.refs{margin:0 0 6px;padding-left:18px;font-size:13px;display:grid;gap:3px}
.legst{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:13.5px}

.sim{margin-top:12px;display:grid;gap:10px}
.sim h3{font-family:var(--f-head);font-size:18px;margin:0}
.sim h4{margin:6px 0 0;font-size:14px}
.simstat{margin:0;display:flex;flex-wrap:wrap;gap:6px}
.simgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sim .exwrap output{font:500 12px var(--f-mono);min-width:44px;text-align:right}
.levels{display:flex;flex-wrap:wrap;gap:6px}
.lvtext{font-size:14px;line-height:1.55}
.lvtext p{margin:6px 0}
.slabel{position:absolute;left:0;top:0;background:var(--surface);border:1.5px solid #1e7fd0;color:var(--ink);font:600 11px/1.3 var(--f-mono);padding:2px 7px;border-radius:6px;white-space:nowrap;pointer-events:none;will-change:transform}
.simhud{position:absolute;left:8px;top:8px;z-index:3;max-width:calc(100% - 16px);background:var(--surface);border:1.5px solid #1e7fd0;border-radius:8px;padding:4px 9px;font:600 12px/1.35 var(--f-mono);color:var(--ink);pointer-events:none}
@media (max-width:600px){.stage.sysmode .pin,.stage.sysmode .leaders{display:none!important}.slabel{font-size:10px;padding:2px 5px}}
/* bengkel virtual */
.shopc{margin-top:12px;display:grid;gap:10px}
.shopc h3{font-family:var(--f-head);font-size:18px;margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tabs [role=tab]{font:600 13px/1 var(--f-body);padding:11px 12px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;background:transparent;color:var(--ink);cursor:pointer}
.tabs [role=tab][aria-selected=true]{background:var(--ink);color:var(--bg)}
#shopBody{display:grid;gap:10px}
.bomw{max-height:340px;overflow:auto}
table.bom{font-size:12px}
table.bom td,table.bom th{white-space:nowrap}
table.bomd{border-collapse:collapse;font-size:13px;width:100%}
table.bomd th{text-align:left;font-weight:600;padding:4px 8px 4px 0;vertical-align:top;width:34%}
table.bomd td{padding:4px 0;vertical-align:top}
.cl{font:600 11px/1.3 var(--f-mono);background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:1px 5px;white-space:nowrap}
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.btn.tool{font-size:13px;text-align:left}
.btn.tool[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.tool:disabled{opacity:.45;cursor:not-allowed}
.shopc .fb{padding:10px 12px;border-radius:8px;background:var(--chip);border:1px solid var(--line);font-size:14px}
.shopc .fb.ok{border-color:var(--ok)}.shopc .fb.bad{border-color:var(--bad)}
.ask{border:1.5px solid var(--accent);border-radius:8px;padding:8px 10px;display:grid;gap:6px}
.ask p{margin:0}
.btn.opt{text-align:left;white-space:normal;line-height:1.35}
ol.steps li.dn{opacity:.55}
.shopc details summary{cursor:pointer;font-weight:600;min-height:32px}
@media (pointer:coarse){.tabs [role=tab]{min-height:44px}}
.shophud{position:absolute;left:8px;right:8px;top:8px;z-index:3;background:var(--surface);border:1.5px solid var(--accent);border-radius:10px;padding:6px 8px;box-shadow:0 4px 14px rgba(0,0,0,.16);display:grid;gap:4px}
.shophud p{margin:0;font-size:13px;line-height:1.35}
.shophud p .ok{color:var(--ok)}.shophud p .bad{color:var(--bad)}
.shophud .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.shophud .tl{font:500 12px var(--f-mono);color:var(--muted)}
.stage.shopon .simhud{display:none!important}

      if(orient===undefined||orient===null){st.ask={s:s,tool:tool};render();return {ok:false,ask:true,msg:s.orient.q};}
