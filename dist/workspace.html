<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Workspace — orangmesin</title>
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="assets/workspace.css">
  <script type="module" src="assets/workspace.js"></script>
</head>
<body class="workspace-page">
  <a class="workspace-back btn" href="/#catalog" data-i18n="navCatalog">Katalog</a>
  <main>
    <section class="workspace-loading">
      <h1 id="workspace-title">Workspace 3D</h1>
      <p id="workspace-note"></p>
      <div id="workspace-status" role="status">Memuat workspace…</div>
    </section>
    <iframe id="workspace-frame" title="Workspace 3D mesin kapal" allow="fullscreen" hidden></iframe>
  </main>
  <dialog id="account-dialog">
    <div class="dialog-head"><h2 data-i18n="account">Akun saya</h2><button data-close aria-label="Tutup">×</button></div>
    <div id="account-content"></div>
  </dialog>
  <div id="toast" role="status"></div>
</body>
</html>
